plugins { id 'com.android.application' }
android {
    namespace 'com.mediplanner.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mediplanner.app'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.11.0' }
