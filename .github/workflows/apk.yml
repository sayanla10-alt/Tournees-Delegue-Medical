name: APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Construction (non signée ; la signature se fait hors de GitHub)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee $RUNNER_TEMP/construction.log
          cp app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/MediPlanner-non-signe.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar $RUNNER_TEMP/apksigner.jar
      - name: Publication (release « apk-build »)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view apk-build >/dev/null 2>&1 || gh release create apk-build --title "MediPlanner Android (construction)" --notes "APK non signée, outil de signature et journal de construction."
          tail -c 60000 $RUNNER_TEMP/construction.log > $RUNNER_TEMP/construction.txt 2>/dev/null || echo "pas de journal" > $RUNNER_TEMP/construction.txt
          gh release upload apk-build $RUNNER_TEMP/construction.txt --clobber
          if [ -f $RUNNER_TEMP/apksigner.jar ]; then gh release upload apk-build $RUNNER_TEMP/MediPlanner-non-signe.apk $RUNNER_TEMP/apksigner.jar --clobber; fi
